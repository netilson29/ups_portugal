<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - UPS Portugal (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-3">
      <img src="{{ url_for('static', filename='logo.jpg') }}" alt="UPS Logo" class="mb-2" style="width: 80px;">
      <h4 class="fw-bold text-warning">Área do Administrador</h4>
    </div>

    <!-- Formulário de Login -->
    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="mb-3">
        <input type="text" name="username" class="form-control" placeholder="Usuário" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Senha" required>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-bold">Entrar</button>
    </form>

    <!-- Mensagem de erro -->
    {% if erro %}
      <div class="alert alert-danger mt-3 text-center">
        {{ erro }}
      </div>
    {% endif %}

    <div class="text-center mt-3">
      <a href="/" class="btn btn-link">⬅️ Voltar ao site</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
